<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>OSA Admin</title>
  <link rel="icon" type="image/png" href="/assets/images/app-icon-admin-192.png">
  <link rel="manifest" href="/admin/manifest.json">
  <meta name="theme-color" content="#841a2d">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="OSA Admin">
  <link rel="apple-touch-icon" sizes="120x120" href="/assets/images/app-icon-admin-120.png">
  <link rel="apple-touch-icon" sizes="152x152" href="/assets/images/app-icon-admin-152.png">
  <link rel="apple-touch-icon" sizes="167x167" href="/assets/images/app-icon-admin-167.png">
  <link rel="apple-touch-icon" sizes="180x180" href="/assets/images/app-icon-admin-180.png">
  <link rel="apple-touch-icon" href="/assets/images/app-icon-admin-180.png">
  <script>
    (function () {
      fetch("/admin/dashboard.html", { cache: "no-store" })
        .then(function (response) {
          if (!response.ok) throw new Error("Failed to load page.");
          return response.text();
        })
        .then(function (html) {
          document.open();
          document.write(html);
          document.close();
        })
        .catch(function () {
          document.body.innerHTML = 'Unable to load page. <a href="/admin/dashboard.html">Open fallback</a>.';
        });
    })();
  </script>
</head>
<body></body>
</html>
