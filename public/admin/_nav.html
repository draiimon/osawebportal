<!-- SHARED ADMIN NAVIGATION PARTIAL
     Include inline in each admin page.
     admin-shell.js will populate dynamic content.
     Mirrors the public /preview navbar style: text-only links,
     no SVG icons, no announcement / lost-found count badges. -->

<!-- TOP NAV -->
<nav class="admin-nav" id="admin-nav" role="navigation" aria-label="Admin navigation">
  <button class="nav-hamburger" id="nav-hamburger" aria-label="Open navigation menu" aria-expanded="false" aria-controls="admin-drawer">
    <span class="nav-hamburger__icon" aria-hidden="true"><span></span><span></span><span></span></span>
  </button>

  <a class="admin-nav__brand" href="/admin/dashboard">
    <img class="admin-nav__logo" src="/assets/images/eac-emblem.png" alt="EAC Cavite" onerror="this.style.display='none'">
    <div class="admin-nav__title">
      <strong>EAC Cavite</strong>
      <span>OSA Admin Panel</span>
    </div>
  </a>

  <div class="admin-nav__sep" aria-hidden="true"></div>

  <div class="admin-nav__links" role="menubar">
    <a class="nav-link" href="/admin/dashboard" role="menuitem">Dashboard</a>
    <a class="nav-link" href="/admin/modules/announcements" role="menuitem">Announcements</a>
    <a class="nav-link" href="/admin/modules/lost-found" role="menuitem">Lost &amp; Found</a>
    <a class="nav-link" href="/admin/modules/home-content" role="menuitem">Home Content</a>
    <a class="nav-link" href="/admin/modules/about" role="menuitem">About Page</a>
    <a class="nav-link" href="/admin/modules/chat-support" role="menuitem">
      Chat Support
      <span class="nav-badge" data-nav-badge="chat" style="display:none">0</span>
    </a>
    <a class="nav-link nav-link--portal" href="/" target="_blank" rel="noopener noreferrer" role="menuitem">Live Portal</a>
  </div>

  <div class="admin-nav__right">
    <div class="admin-avatar" data-admin-initials aria-hidden="true">AD</div>
    <div class="admin-name-wrap">
      <strong data-admin-name>Administrator</strong>
      <span data-admin-email></span>
    </div>
    <button class="btn-logout" data-logout type="button" aria-label="Log out">
      <span>Log Out</span>
    </button>
  </div>
</nav>

<!-- UTILITY BAR -->
<div class="admin-util-bar" id="admin-util-bar" role="banner">
  <div class="util-left">
    <span class="util-page-title" id="util-page-title"></span>
    <nav class="util-breadcrumb" aria-label="Breadcrumb">
      <span>OSA Admin</span>
      <span class="sep" aria-hidden="true">›</span>
      <span id="util-breadcrumb-page"></span>
    </nav>
  </div>
  <div class="util-right">
    <time class="util-datetime" id="util-datetime" aria-live="off" aria-label="Philippine Standard Time">
      <span class="util-datetime__date" id="dt-date"></span>
      <span class="util-datetime__sep" aria-hidden="true">·</span>
      <span class="util-datetime__time" id="dt-time"></span>
      <span class="util-datetime__ph" aria-label="Philippine Standard Time">PST</span>
    </time>
    <a class="util-portal-link" href="/" target="_blank" rel="noopener noreferrer">Live Portal</a>
  </div>
</div>

<!-- MOBILE DRAWER -->
<div class="admin-drawer" id="admin-drawer" role="dialog" aria-modal="true" aria-label="Navigation menu">
  <div class="drawer-backdrop" id="drawer-backdrop" aria-hidden="true"></div>
  <div class="drawer-panel">
    <div class="drawer-header">
      <div class="drawer-brand">
        <img src="/assets/images/eac-emblem.png" alt="EAC Cavite" onerror="this.style.display='none'">
        <div class="drawer-brand-text">
          <strong>EAC Cavite</strong>
          <span>OSA Admin Panel</span>
        </div>
      </div>
      <button class="drawer-close" id="drawer-close" aria-label="Close menu">×</button>
    </div>
    <nav class="drawer-nav" aria-label="Mobile admin navigation">
      <a class="drawer-nav-item" href="/admin/dashboard">Dashboard</a>
      <a class="drawer-nav-item" href="/admin/modules/announcements">Announcements</a>
      <a class="drawer-nav-item" href="/admin/modules/lost-found">Lost &amp; Found</a>
      <a class="drawer-nav-item" href="/admin/modules/home-content">Home Content</a>
      <a class="drawer-nav-item" href="/admin/modules/about">About Page</a>
      <a class="drawer-nav-item" href="/admin/modules/chat-support">
        Chat Support
        <span class="nav-badge" data-nav-badge="chat" style="display:none">0</span>
      </a>
      <a class="drawer-nav-item drawer-nav-item--portal" href="/" target="_blank" rel="noopener noreferrer">View Live Portal</a>
    </nav>
    <div class="drawer-footer">
      <div class="drawer-profile">
        <div class="admin-avatar" data-admin-initials aria-hidden="true">AD</div>
        <div class="drawer-profile-text">
          <strong data-admin-name>Administrator</strong>
          <span data-admin-email></span>
        </div>
      </div>
      <button class="drawer-logout" data-logout type="button">Log Out</button>
    </div>
  </div>
</div>
