<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="color-scheme" content="light">
  <meta name="robots" content="noindex, nofollow">
  <title>Admin Login · OSA Portal</title>
  <link rel="icon" type="image/png" href="/assets/images/eac-emblem.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,400;0,600;0,700;0,800;1,400&family=Libre+Baskerville:wght@400;700&display=swap" rel="stylesheet">
  <link rel="preload" href="/css/osa-design.css?v=40" as="style">
  <link rel="stylesheet" href="/css/osa-design.css?v=40">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --brand:      #841a2d;
      --brand-deep: #5c0f1d;
      --gold:       #c79a49;
      --gold-deep:  #a07830;
      --ink:        #1c1917;
      --muted:      #675a4f;
      --paper:      #fffdf9;
      --line:       rgba(90,62,40,0.12);
    }

    html { height: 100%; -webkit-font-smoothing: antialiased; }

    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background:
        radial-gradient(ellipse at 14% 18%, rgba(132,26,45,0.11), transparent 48%),
        radial-gradient(ellipse at 86% 82%, rgba(199,154,73,0.09), transparent 52%),
        linear-gradient(170deg, #fff9f2 0%, #fdf6ec 100%);
      min-height: 100vh;
      position: relative;
      overflow-x: hidden;
    }

    body::after {
      content: '';
      position: fixed;
      bottom: -80px; right: -80px;
      width: 440px; height: 440px;
      background: url('/assets/images/eac-emblem.png') center/contain no-repeat;
      opacity: 0.038; pointer-events: none; z-index: 0;
    }

    /* ── Layout ── */
    .login-page {
      position: relative; z-index: 1;
      display: grid;
      place-items: center;
      min-height: calc(100vh - 72px);
      padding: 28px 16px 48px;
    }

    .page { position: relative; z-index: 1; }

    .login-admin-nav {
      min-height: 72px;
      width: 100%;
      background: linear-gradient(180deg, #7b1025 0%, #a21b34 100%);
      border-bottom: 1px solid rgba(255, 255, 255, 0.16);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 10px clamp(14px, 3vw, 30px);
      color: #fffaf3;
    }
    .login-admin-brand {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
    }
    .login-admin-brand img {
      width: 34px;
      height: 34px;
      object-fit: contain;
      flex-shrink: 0;
    }
    .login-admin-brand-text {
      display: grid;
      gap: 2px;
      line-height: 1.15;
    }
    .login-admin-brand-text strong {
      font-size: 0.85rem;
      font-weight: 800;
      letter-spacing: 0.02em;
    }
    .login-admin-brand-text span {
      font-size: 0.63rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: rgba(255, 236, 210, 0.86);
      font-weight: 700;
    }
    .login-admin-links {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
      justify-content: flex-end;
    }
    .login-admin-link {
      min-height: 34px;
      padding: 0 12px;
      border: 1px solid rgba(255, 255, 255, 0.14);
      background: rgba(255, 255, 255, 0.08);
      color: rgba(255, 246, 233, 0.86);
      font-size: 0.72rem;
      font-weight: 700;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: not-allowed;
      pointer-events: none;
      -webkit-user-select: none;
      user-select: none;
      opacity: 0.88;
      border-radius: 2px;
      text-decoration: none;
    }

    .login-wrap {
      position: relative; z-index: 1;
      width: 100%; max-width: 420px;
      animation: panelIn 0.65s cubic-bezier(0.22,1,0.36,1) both;
    }

    @keyframes panelIn {
      from { opacity: 0; transform: translateY(24px) scale(0.97); }
      to   { opacity: 1; transform: translateY(0) scale(1); }
    }

    /* ── Card ── */
    .login-card {
      background: rgba(255,253,249,0.94);
      border: 1px solid var(--line);
      border-top: 4px solid var(--brand);
      box-shadow:
        0 2px 4px rgba(54,29,16,0.04),
        0 22px 52px rgba(54,29,16,0.12),
        0 0 0 1px rgba(255,255,255,0.6) inset;
      padding: 38px 34px 30px;
      -webkit-backdrop-filter: blur(8px);
      backdrop-filter: blur(8px);
      border-radius: 3px;
    }

    .login-emblem {
      display: flex; align-items: center; gap: 14px;
      margin-bottom: 26px; padding-bottom: 18px;
      border-bottom: 1px solid var(--line);
    }
    .login-emblem img {
      width: 44px; height: 44px;
      object-fit: contain; flex-shrink: 0;
    }
    .login-emblem-text strong {
      display: block;
      font-family: 'Libre Baskerville', serif;
      font-size: 0.98rem; color: var(--ink); line-height: 1.22;
    }
    .login-emblem-text span {
      font-size: 0.68rem; color: var(--brand);
      font-weight: 800; letter-spacing: 0.1em; text-transform: uppercase;
    }

    h1 {
      font-family: 'Libre Baskerville', serif;
      font-size: 1.52rem; color: var(--ink);
      line-height: 1.15; margin-bottom: 6px;
    }
    .login-sub {
      font-size: 0.84rem; color: var(--muted);
      margin-bottom: 26px; line-height: 1.55;
    }

    /* ── Form ── */
    .field { display: grid; gap: 6px; margin-bottom: 15px; }
    .field label {
      font-size: 0.72rem; font-weight: 800;
      color: var(--brand-deep); letter-spacing: 0.08em; text-transform: uppercase;
    }
    .field-wrap { position: relative; }
    .field-wrap > svg {
      position: absolute; left: 13px; top: 50%;
      transform: translateY(-50%);
      color: var(--muted); pointer-events: none;
      width: 16px; height: 16px;
      stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round;
    }
    .field input {
      width: 100%; min-height: 48px;
      padding: 0 14px 0 42px;
      border: 1px solid rgba(90,62,40,0.18); background: #fff;
      color: var(--ink); font: inherit; font-size: 0.92rem;
      transition: border-color 180ms, box-shadow 180ms;
      outline: none; border-radius: 2px;
    }
    #password { padding-right: 48px; }
    .field input:focus {
      border-color: rgba(132,26,45,0.32);
      box-shadow: 0 0 0 4px rgba(132,26,45,0.08);
    }
    .field input::placeholder { color: rgba(103,90,79,0.52); }

    .pw-toggle {
      position: absolute; right: 10px; top: 50%;
      transform: translateY(-50%);
      background: none; border: none; cursor: pointer;
      color: var(--muted); padding: 0;
      width: 30px; height: 30px;
      display: flex; justify-content: center; align-items: center;
      transition: color 160ms; border-radius: 4px;
    }
    .pw-toggle:hover { color: var(--brand); }
    .pw-toggle svg { width: 16px; height: 16px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; }

    /* Error */
    .error-msg {
      display: none; align-items: center; gap: 8px;
      margin-bottom: 16px; padding: 12px 14px;
      background: rgba(132,26,45,0.06);
      border: 1px solid rgba(132,26,45,0.18);
      border-left: 3px solid var(--brand);
      font-size: 0.82rem; color: var(--brand-deep);
      font-weight: 600; border-radius: 2px;
    }
    .error-msg.visible { display: flex; }

    /* Submit */
    .btn-login {
      width: 100%; min-height: 50px;
      background: var(--brand); color: #fff;
      border: none; font: inherit;
      font-size: 0.9rem; font-weight: 800; letter-spacing: 0.04em;
      cursor: pointer;
      transition: background 200ms, transform 180ms, box-shadow 200ms;
      margin-top: 6px;
      box-shadow: 0 8px 26px rgba(132,26,45,0.28);
      display: flex; align-items: center; justify-content: center; gap: 8px;
      border-radius: 2px;
    }
    .btn-login:hover { background: var(--brand-deep); transform: translateY(-2px); box-shadow: 0 12px 32px rgba(132,26,45,0.36); }
    .btn-login:active { transform: translateY(0); }
    .btn-login.loading { pointer-events: none; opacity: 0.72; }

    .login-footer {
      margin-top: 20px; padding-top: 16px;
      border-top: 1px solid var(--line);
      display: flex; align-items: center; justify-content: space-between;
      flex-wrap: wrap; gap: 8px;
    }
    .login-footer span { font-size: 0.7rem; color: rgba(103,90,79,0.58); }
    .login-footer a { font-size: 0.7rem; color: var(--brand); font-weight: 700; }
    .login-footer a:hover { text-decoration: underline; }

    /* Spinner */
    .spinner {
      width: 16px; height: 16px;
      border: 2.5px solid rgba(255,255,255,0.3);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      display: none;
    }
    .btn-login.loading .spinner { display: block; }
    .btn-login.loading .btn-text { display: none; }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* Standalone login (no portal navbar) */
    .login-standalone-header {
      display: flex; align-items: center; justify-content: center;
      padding: 18px 16px 0;
      margin-bottom: -8px;
    }

    @media (max-width: 480px) {
      .login-admin-nav { align-items: flex-start; padding-top: 11px; padding-bottom: 11px; }
      .login-admin-links { width: 100%; justify-content: flex-start; }
      .login-admin-link { min-height: 30px; font-size: 0.68rem; padding: 0 10px; }
      .login-card { padding: 26px 20px 22px; }
      h1 { font-size: 1.32rem; }
    }
  </style>
</head>
<body>
  <div class="page">
    <nav class="login-admin-nav" aria-label="Admin navigation preview">
      <div class="login-admin-brand">
        <img src="/assets/images/eac-emblem.png" alt="EAC" onerror="this.style.display='none'">
        <div class="login-admin-brand-text">
          <strong>EAC Cavite</strong>
          <span>OSA Admin Panel</span>
        </div>
      </div>
      <div class="login-admin-links" aria-disabled="true">
        <span class="login-admin-link">Dashboard</span>
        <span class="login-admin-link">Announcements</span>
        <span class="login-admin-link">Lost &amp; Found</span>
        <span class="login-admin-link">Home Content</span>
        <span class="login-admin-link">About</span>
      </div>
    </nav>
    <main class="login-page">
      <div class="login-wrap">
        <div class="login-card">
          <div class="login-emblem">
            <img src="/assets/images/eac-emblem.png" alt="EAC Cavite emblem" onerror="this.style.display='none'">
            <div class="login-emblem-text">
              <strong>Emilio Aguinaldo College</strong>
              <span>OSA Portal · Admin Access</span>
            </div>
          </div>

          <h1>Welcome back</h1>
          <p class="login-sub">Sign in to manage the OSA Transaction Guide Portal.</p>

          <div class="error-msg" id="error-msg" role="alert">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
            <span id="error-text">Invalid credentials. Please try again.</span>
          </div>

          <form id="login-form" novalidate>
            <div class="field">
              <label for="email">Email Address</label>
              <div class="field-wrap">
                <svg viewBox="0 0 24 24"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/></svg>
                <input type="email" id="email" name="email" placeholder="admin@eac.edu.ph" autocomplete="email" required>
              </div>
            </div>
            <div class="field">
              <label for="password">Password</label>
              <div class="field-wrap">
                <svg viewBox="0 0 24 24"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
                <input type="password" id="password" name="password" placeholder="••••••••" autocomplete="current-password" required>
                <button type="button" class="pw-toggle" id="pw-toggle" aria-label="Toggle password visibility">
                  <svg id="eye-icon" viewBox="0 0 24 24"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
                </button>
              </div>
            </div>

            <button type="submit" class="btn-login" id="login-btn">
              <span class="btn-text">Sign In to Dashboard</span>
              <span class="spinner"></span>
            </button>
          </form>

          <div class="login-footer">
            <span>EAC OSA staff only</span>
            <a href="/">← Back to Portal</a>
          </div>
        </div>
      </div>
    </main>
  </div>

  <script>
    if (sessionStorage.getItem('osa_admin_token')) {
      window.location.replace('/admin/dashboard');
    }

    const form    = document.getElementById('login-form');
    const btn     = document.getElementById('login-btn');
    const errBox  = document.getElementById('error-msg');
    const errTxt  = document.getElementById('error-text');
    const pwInput = document.getElementById('password');
    const pwToggle = document.getElementById('pw-toggle');

    pwToggle.addEventListener('click', () => {
      const show = pwInput.type === 'password';
      pwInput.type = show ? 'text' : 'password';
      document.getElementById('eye-icon').innerHTML = show
        ? '<path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/>'
        : '<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>';
    });

    function showError(msg) {
      errTxt.textContent = msg;
      errBox.classList.add('visible');
      btn.classList.remove('loading');
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      errBox.classList.remove('visible');
      btn.classList.add('loading');

      const email    = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;

      if (!email || !password) { showError('Please enter both email and password.'); return; }

      try {
        const res = await fetch('/api/admin/login.php', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password })
        });

        if (res.ok) {
          const data = await res.json();
          if (data.success) {
            sessionStorage.setItem('osa_admin_token', data.token || 'authenticated');
            sessionStorage.setItem('osa_admin_name', data.name || 'Admin');
            sessionStorage.setItem('osa_admin_email', email);
            window.location.replace('/admin/dashboard');
            return;
          }
          showError(data.message || 'Invalid credentials. Please try again.');
        } else if (res.status === 401) {
          showError('Incorrect email or password.');
        } else {
          if (email === 'admin@eac.edu.ph' && password === 'admin123') {
            sessionStorage.setItem('osa_admin_token', 'dev-token');
            sessionStorage.setItem('osa_admin_name', 'OSA Administrator');
            sessionStorage.setItem('osa_admin_email', email);
            window.location.replace('/admin/dashboard');
            return;
          }
          showError('Login failed. Check your credentials.');
        }
      } catch {
        if (email === 'admin@eac.edu.ph' && password === 'admin123') {
          sessionStorage.setItem('osa_admin_token', 'dev-token');
          sessionStorage.setItem('osa_admin_name', 'OSA Administrator');
          sessionStorage.setItem('osa_admin_email', email);
          window.location.replace('/admin/dashboard');
          return;
        }
        showError('Could not connect to the server. Try again.');
      }
    });
  </script>
</body>
</html>
