<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="color-scheme" content="light">
    <script>
        (function () {
            window.__OSAInlineBootActive = true;
            window.__OSAInlineBootShown = false;
            window.__OSAInlineBootShowTimer = null;
            document.documentElement.classList.add("osa-inline-booting");
            function ensureBootLoader() {
                if (document.getElementById("osa-inline-loader")) return;
                var html = ''
                    + '<div class="osa-loader" id="osa-inline-loader" role="status" aria-live="polite" aria-label="Loading content">'
                    + '  <div class="osa-loader__backdrop"></div>'
                    + '  <div class="osa-loader__card">'
                    + '    <div class="osa-loader__spinner" aria-hidden="true"></div>'
                    + '    <div class="osa-loader__content">'
                    + '      <strong>Loading OSA Portal</strong>'
                    + '      <span>Please wait while content is prepared...</span>'
                    + '    </div>'
                    + '    <div class="osa-loader__bar"><span></span></div>'
                    + '  </div>'
                    + '</div>';
                document.documentElement.insertAdjacentHTML("afterbegin", html);
            }
            ensureBootLoader();
            window.__OSAInlineBootShowTimer = window.setTimeout(function () {
                if (!window.__OSAInlineBootActive) return;
                var inlineLoader = document.getElementById("osa-inline-loader");
                if (!inlineLoader) return;
                inlineLoader.classList.add("is-visible");
                document.documentElement.classList.add("osa-inline-loader-visible");
                window.__OSAInlineBootShown = true;
            }, 220);
            if (window.location.hash === "#dashboard") {
                window.history.replaceState({}, "", window.location.pathname + window.location.search);
            }
            if (/\/preview\.html$/i.test(window.location.pathname)) {
                var cleanPath = window.location.pathname.replace(/\/preview\.html$/i, "/");
                var cleanHash = window.location.hash === "#dashboard" ? "" : window.location.hash;
                var cleanUrl = cleanPath + window.location.search + cleanHash;
                window.history.replaceState({}, "", cleanUrl);
            }
        })();
    </script>
    <style>
        /* :root design tokens come from osa-design.css (global).
           Keep only home-page content layout below. */
    </style>
    <link rel="preload" href="./css/osa-design.css?v=41" as="style">
    <link rel="preload" href="./css/osa-ai.css?v=45" as="style">
    <link rel="stylesheet" href="./css/osa-design.css?v=41">
    <link rel="stylesheet" href="./css/osa-ai.css?v=45">
    <link rel="stylesheet" href="./css/osa-chat-widget-island.min.css?v=4">
    <script src="/assets/js/portal-shell.js?v=44" defer></script>
    <script src="/assets/js/osa-chat-loader.js?v=66" defer></script>
</head>
<body></body>
</html>
